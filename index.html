<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" type="module"></script>
    <link
      rel="stylesheet"
      href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css"
    />
    <link
      rel="shortcut icon"
      href="assets/images/background.jpg"
      type="image/x-icon"
    />
    <title>Music Player</title>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="top-container">
          <div class="img-container">
            <img
              src="/assets/images/background.jpg"
              alt="Music Background Image"
              srcset="/assets/images/background.jpg"
            />
          </div>
          <div class="btn-container">
            <i class="hgi hgi-stroke hgi-previous"></i>
            <i class="hgi hgi-stroke hgi-play-circle" id="play-pause-btn"></i>
            <i class="hgi hgi-stroke hgi-next"></i>
            <span class="btn-playback">2x</span>
          </div>
        </div>
        <div class="bottom-container">
            <div class="song-title-container">
                <h4 class="song-title">Ceci est le titre</h4>
            </div>
            <div class="slide">
                <div class="slide-indicator"></div>
                <audio src="#" id="audio-player"></audio>
            </div>
            <div class="time-info-container">
                <span class="current-time">00:00</span>
                <span class="song-full-time">00:00</span>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
